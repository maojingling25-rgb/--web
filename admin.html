<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容审核 | 听见全球 AI 前沿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./public-config.js"></script>
    <style>
      :root {
        --ink: #20211f;
        --soft: #595b55;
        --muted: #777a72;
        --paper: #f7f7f3;
        --panel: #ffffff;
        --line: #d5d7d0;
        --accent: #a9473c;
        --good: #34694f;
        --bad: #9a3e35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Noto Sans SC", sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1220px, calc(100% - 40px));
        margin: 0 auto;
      }

      .topbar {
        padding: 11px 0;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        font: 10px/1.3 "DM Mono", monospace;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        padding: 34px 0 24px;
        border-bottom: 1px solid var(--line);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4vw, 46px);
        letter-spacing: -0.08em;
        line-height: 1;
      }

      h2 {
        font-size: 22px;
        letter-spacing: -0.05em;
      }

      .header-meta {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      .header-meta a {
        display: inline-block;
        margin-top: 8px;
        color: var(--accent);
      }

      .auth-panel,
      .workspace {
        margin: 32px 0 80px;
        padding: 26px;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      .auth-panel {
        max-width: 560px;
      }

      .auth-panel p {
        margin-top: 10px;
        color: var(--soft);
        font-size: 13px;
        line-height: 1.7;
      }

      .auth-form {
        display: flex;
        gap: 8px;
        margin-top: 22px;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 11px 12px;
        color: var(--ink);
        border: 1px solid var(--line);
        outline: 0;
        background: var(--paper);
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--accent);
      }

      textarea {
        min-height: 125px;
        resize: vertical;
        line-height: 1.65;
      }

      #article-insights {
        min-height: 420px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        line-height: 1.6;
      }

      button {
        padding: 10px 14px;
        color: var(--paper);
        border: 1px solid var(--ink);
        background: var(--ink);
        font-size: 12px;
        font-weight: 700;
      }

      button.secondary {
        color: var(--ink);
        border-color: var(--line);
        background: var(--paper);
      }

      button.good {
        border-color: var(--good);
        background: var(--good);
      }

      button.bad {
        border-color: var(--bad);
        background: var(--bad);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.5;
      }

      .status {
        min-height: 20px;
        margin-top: 13px;
        color: var(--muted);
        font-size: 12px;
      }

      .status.error {
        color: var(--bad);
      }

      .status.success {
        color: var(--good);
      }

      .workspace {
        display: none;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
      }

      .workspace.is-visible {
        display: grid;
      }

      .queue {
        border-right: 1px solid var(--line);
        padding-right: 22px;
      }

      .queue-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 17px;
      }

      .queue-count {
        color: var(--muted);
        font: 10px/1 "DM Mono", monospace;
      }

      .queue-list {
        display: grid;
        gap: 7px;
      }

      .queue-item {
        width: 100%;
        padding: 12px;
        color: var(--ink);
        border: 1px solid var(--line);
        background: var(--paper);
        text-align: left;
      }

      .queue-item.is-selected {
        border-color: var(--accent);
        background: #f4eae7;
      }

      .queue-item strong {
        display: block;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.45;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .queue-item small {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font: 10px/1.35 "DM Mono", monospace;
      }

      .empty {
        padding: 22px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .editor {
        min-width: 0;
      }

      .editor-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .editor-head p {
        margin-top: 7px;
        color: var(--muted);
        font: 10px/1.4 "DM Mono", monospace;
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 7px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--soft);
        font-size: 11px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      .source-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent);
        font-size: 12px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .queue {
          padding-right: 0;
          padding-bottom: 22px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100% - 28px, 1220px);
        }

        header {
          align-items: start;
          flex-direction: column;
        }

        .header-meta {
          text-align: left;
        }

        .auth-panel,
        .workspace {
          padding: 18px;
        }

        .auth-form,
        .field-grid {
          display: grid;
          grid-template-columns: 1fr;
        }

        .field-full {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar"><div class="shell">Editorial operations / private review area</div></div>
    <header class="shell">
      <div>
        <h1>内容审核</h1>
        <p class="status" id="session-status">正在检查登录状态…</p>
      </div>
      <div class="header-meta">
        仅管理员可访问
        <br />
        <a href="./index.html">返回公开网站</a>
      </div>
    </header>

    <main class="shell">
      <section class="auth-panel" id="auth-panel">
        <h2>管理员登录</h2>
        <p>
          使用管理员邮箱接收一次性登录链接。公开访客没有编辑权限，发布内容必须经过这里审核。
        </p>
        <form class="auth-form" id="auth-form">
          <input id="auth-email" type="email" required value="maojingling25@gmail.com" aria-label="管理员邮箱" />
          <button type="submit">发送登录链接</button>
        </form>
        <div class="status" id="auth-status"></div>
      </section>

      <section class="workspace" id="workspace">
        <aside class="queue">
          <div class="queue-head">
            <h2>审核队列</h2>
            <span class="queue-count" id="queue-count">0 条</span>
          </div>
          <div class="queue-list" id="queue-list"></div>
          <div class="empty hidden" id="queue-empty">当前没有待处理内容。</div>
        </aside>

        <section class="editor">
          <div class="editor-head">
            <div>
              <h2 id="editor-title">选择一篇内容</h2>
              <p id="editor-meta">草稿和已发布内容都会显示在这里。</p>
            </div>
            <div class="editor-actions">
              <button class="secondary" id="refresh-button" type="button">刷新</button>
              <button class="secondary" id="logout-button" type="button">退出登录</button>
            </div>
          </div>

          <form class="field-grid" id="article-form">
            <label class="field-full">
              标题
              <input id="article-title" required />
            </label>
            <label>
              分类
              <select id="article-category">
                <option>模型与产品</option>
                <option>智能体</option>
                <option>AI 应用</option>
                <option>机器人与具身智能</option>
                <option>创业与融资</option>
                <option>算力与基础设施</option>
                <option>开源生态</option>
                <option>教育与工作</option>
                <option>AI 安全与治理</option>
                <option>未来社会</option>
              </select>
            </label>
            <label>
              标签
              <input id="article-tags" placeholder="用逗号分隔" />
            </label>
            <label class="field-full">
              摘要
              <textarea id="article-summary"></textarea>
            </label>
            <label class="field-full">
              核心嘉宾（访谈中输出主要观点的人物）
              <input id="article-guest-name" placeholder="例如：Dario Amodei" />
            </label>
            <label class="field-full">
              嘉宾介绍（只介绍上方人物，不介绍频道或播客）
              <textarea id="article-guest"></textarea>
            </label>
            <label class="field-full">
              重要观点（每行一条）
              <textarea id="article-points"></textarea>
            </label>
            <label class="field-full">
              结构化洞察（JSON，7-10 条；每条包含 title、claim、analysis、value）
              <textarea id="article-insights" spellcheck="false"></textarea>
            </label>
            <label class="field-full">
              编辑解读
              <textarea id="article-analysis"></textarea>
            </label>
            <label class="field-full">
              完整正文（不少于 800 字，支持 Markdown 小标题）
              <textarea id="article-content"></textarea>
            </label>
            <label class="field-full">
              单集页面链接
              <input id="article-episode-url" placeholder="对应访谈的单集页面" />
            </label>
            <label class="field-full">
              原始播放链接
              <input id="article-play-url" placeholder="音频直链或视频播放页，不填则使用单集页面" />
            </label>
          </form>
          <a class="source-link" id="article-source" href="#" target="_blank" rel="noreferrer">打开原始播放链接</a>
          <div class="status" id="editor-status"></div>
          <div class="editor-actions" style="margin-top: 18px">
            <button class="secondary" id="save-button" type="button">保存修改</button>
            <button class="bad" id="reject-button" type="button">拒绝</button>
            <button class="good" id="publish-button" type="button">通过并发布</button>
            <button class="secondary" id="unpublish-button" type="button">下线</button>
          </div>
        </section>
      </section>
    </main>

    <script>
      const config = window.SITE_CONFIG || {};
      const adminEmail = config.adminEmail || "maojingling25@gmail.com";
      const authPanel = document.querySelector("#auth-panel");
      const workspace = document.querySelector("#workspace");
      const authStatus = document.querySelector("#auth-status");
      const sessionStatus = document.querySelector("#session-status");
      const queueList = document.querySelector("#queue-list");
      const queueEmpty = document.querySelector("#queue-empty");
      const queueCount = document.querySelector("#queue-count");
      const editorStatus = document.querySelector("#editor-status");
      let client;
      let articles = [];
      let selectedId = null;
      let currentUserEmail = "";

      const setStatus = (node, message, kind = "") => {
        node.textContent = message;
        node.className = `status ${kind}`.trim();
      };

      const fields = {
        title: document.querySelector("#article-title"),
        category: document.querySelector("#article-category"),
        tags: document.querySelector("#article-tags"),
        summary: document.querySelector("#article-summary"),
        guestName: document.querySelector("#article-guest-name"),
        guest: document.querySelector("#article-guest"),
        points: document.querySelector("#article-points"),
        insights: document.querySelector("#article-insights"),
        analysis: document.querySelector("#article-analysis"),
        content: document.querySelector("#article-content"),
        episodeUrl: document.querySelector("#article-episode-url"),
        playUrl: document.querySelector("#article-play-url"),
        source: document.querySelector("#article-source"),
      };

      function configured() {
        return Boolean(config.supabaseUrl && config.supabaseAnonKey && window.supabase);
      }

      function selectedArticle() {
        return articles.find((article) => article.id === selectedId);
      }

      function renderQueue() {
        queueList.replaceChildren();
        queueCount.textContent = `${articles.length} 条`;
        queueEmpty.classList.toggle("hidden", articles.length > 0);

        articles.forEach((article) => {
          const button = document.createElement("button");
          button.className = `queue-item ${article.id === selectedId ? "is-selected" : ""}`;
          button.type = "button";
          button.innerHTML = `<strong>${escapeHtml(article.title)}</strong><small>${escapeHtml(article.status)} · ${escapeHtml(article.source_name)}</small>`;
          button.addEventListener("click", () => {
            selectedId = article.id;
            renderQueue();
            renderEditor();
          });
          queueList.append(button);
        });
      }

      function renderEditor() {
        const article = selectedArticle();
        if (!article) {
          document.querySelector("#article-form").reset();
          fields.source.removeAttribute("href");
          document.querySelector("#editor-title").textContent = "选择一篇内容";
          document.querySelector("#editor-meta").textContent = "草稿和已发布内容都会显示在这里。";
          return;
        }

        document.querySelector("#editor-title").textContent = article.title;
        document.querySelector("#editor-meta").textContent =
          `${article.status} · ${article.source_name} · ${formatDate(article.created_at)}`;
        fields.title.value = article.title || "";
        fields.category.value = article.category || "模型与产品";
        fields.tags.value = (article.tags || []).join(", ");
        fields.summary.value = article.summary || "";
        fields.guestName.value = article.guest_name || "待人工确认";
        fields.guest.value = article.guest_intro || "";
        fields.points.value = Array.isArray(article.key_points) ? article.key_points.join("\n") : "";
        fields.insights.value = JSON.stringify(article.insights || [], null, 2);
        fields.analysis.value = article.editorial_analysis || "";
        fields.content.value = article.content || buildContentFromParts(article);
        fields.episodeUrl.value = article.episode_url || "";
        fields.playUrl.value = article.play_url || article.episode_url || "";
        fields.source.href = fields.playUrl.value || "#";
        setStatus(editorStatus, "");
      }

      async function loadArticles() {
        const { data, error } = await client
          .from("articles")
          .select("*")
          .in("status", ["draft", "published"])
          .order("created_at", { ascending: false });

        if (error) throw error;
        articles = data || [];
        selectedId = articles[0]?.id || null;
        renderQueue();
        renderEditor();
      }

      async function requireAdmin() {
        if (!configured()) {
          authPanel.classList.remove("hidden");
          setStatus(authStatus, "尚未配置 Supabase，请先设置 GitHub Pages 的公开运行配置。", "error");
          setStatus(sessionStatus, "未配置");
          return;
        }

        client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        await handleSession(data.session);
        client.auth.onAuthStateChange((_event, nextSession) => {
          void handleSession(nextSession);
        });
      }

      async function handleSession(session) {
        if (!session) {
          authPanel.classList.remove("hidden");
          workspace.classList.remove("is-visible");
          setStatus(sessionStatus, "未登录");
          return;
        }

        if (session.user.email?.toLowerCase() !== adminEmail.toLowerCase()) {
          await client.auth.signOut();
          setStatus(authStatus, "这个邮箱不在管理员名单中。", "error");
          return;
        }

        authPanel.classList.add("hidden");
        workspace.classList.add("is-visible");
        currentUserEmail = session.user.email || "";
        setStatus(sessionStatus, `已登录：${session.user.email}`, "success");
        try {
          await loadArticles();
        } catch (error) {
          setStatus(editorStatus, error.message, "error");
        }
      }

      document.querySelector("#auth-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!configured()) return;
        const email = document.querySelector("#auth-email").value.trim();
        setStatus(authStatus, "正在发送登录链接…");
        const { error } = await client.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: `${window.location.origin}${window.location.pathname}` },
        });
        setStatus(authStatus, error ? error.message : "登录链接已发送，请检查邮箱。", error ? "error" : "success");
      });

      document.querySelector("#refresh-button").addEventListener("click", async () => {
        try {
          await loadArticles();
          setStatus(editorStatus, "已刷新。", "success");
        } catch (error) {
          setStatus(editorStatus, error.message, "error");
        }
      });

      document.querySelector("#logout-button").addEventListener("click", async () => {
        await client?.auth.signOut();
        window.location.reload();
      });

      document.querySelector("#save-button").addEventListener("click", () => updateArticle("draft", "edit"));
      document.querySelector("#publish-button").addEventListener("click", () => updateArticle("published", "publish"));
      document.querySelector("#unpublish-button").addEventListener("click", () => updateArticle("draft", "unpublish"));
      document.querySelector("#reject-button").addEventListener("click", () => updateArticle("rejected", "reject"));

      async function updateArticle(status, action) {
        const article = selectedArticle();
        if (!article) {
          setStatus(editorStatus, "请先选择一篇内容。", "error");
          return;
        }

        const content = fields.content.value.trim();
        const readableLength = content.replace(/[#*_>`\-\s]/g, "").length;
        if (readableLength < 800) {
          setStatus(editorStatus, `完整正文目前只有 ${readableLength} 字，发布前至少需要 800 字。`, "error");
          return;
        }

        const guestName = fields.guestName.value.trim();
        const guestIntro = fields.guest.value.trim();
        if (!guestName) {
          setStatus(editorStatus, "请填写本期输出核心观点的嘉宾姓名。", "error");
          return;
        }
        if (/(播客|频道|节目|媒体|主持人|制作机构|podcast|channel|show|host)/i.test(guestName)) {
          setStatus(editorStatus, "核心嘉宾应填写输出主要观点的人物姓名，不要填写频道、节目、主持人或制作机构。", "error");
          return;
        }
        if (/(播客|频道|节目|媒体|主持人|制作机构|podcast|channel|show|host)/i.test(guestIntro)) {
          setStatus(editorStatus, "嘉宾介绍应只描述人物本人，不要介绍频道、播客、主持人或节目。", "error");
          return;
        }

        let insights;
        try {
          insights = JSON.parse(fields.insights.value.trim() || "[]");
        } catch (error) {
          setStatus(editorStatus, "结构化洞察不是有效 JSON，请检查括号、引号和逗号。", "error");
          return;
        }

        if (!Array.isArray(insights) || insights.length < 7 || insights.length > 10) {
          setStatus(editorStatus, "结构化洞察必须包含 7-10 条。", "error");
          return;
        }

        for (const [index, insight] of insights.entries()) {
          if (!insight || typeof insight !== "object") {
            setStatus(editorStatus, `第 ${index + 1} 条洞察必须是对象。`, "error");
            return;
          }
          for (const field of ["title", "claim", "analysis", "value"]) {
            if (typeof insight[field] !== "string" || !insight[field].trim()) {
              setStatus(editorStatus, `第 ${index + 1} 条洞察缺少 ${field}。`, "error");
              return;
            }
          }
        }

        const payload = {
          title: fields.title.value.trim(),
          category: fields.category.value,
          tags: fields.tags.value
            .split(",")
          .map((tag) => tag.trim())
          .filter(Boolean),
          summary: fields.summary.value.trim(),
          guest_name: guestName,
          guest_intro: guestIntro,
          key_points: fields.points.value
            .split("\n")
            .map((point) => point.trim())
            .filter(Boolean),
          insights,
          editorial_analysis: fields.analysis.value.trim(),
          content,
          episode_url: fields.episodeUrl.value.trim() || null,
          play_url: fields.playUrl.value.trim() || fields.episodeUrl.value.trim() || null,
          status,
          updated_at: new Date().toISOString(),
          published_at: status === "published" ? new Date().toISOString() : null,
        };

        const { data, error } = await client
          .from("articles")
          .update(payload)
          .eq("id", article.id)
          .select("*")
          .single();

        if (error) {
          setStatus(editorStatus, error.message, "error");
          return;
        }

        await client.from("review_actions").insert({
          article_id: article.id,
          action,
          note: status,
          actor_email: currentUserEmail,
        });

        articles = articles.map((item) => (item.id === data.id ? data : item));
        renderQueue();
        renderEditor();
        setStatus(editorStatus, status === "published" ? "已发布到公开网站。" : "已保存。", "success");
      }

      function formatDate(value) {
        return value ? new Date(value).toLocaleString("zh-CN", { hour12: false }) : "时间未知";
      }

      function buildContentFromParts(article) {
        return [
          "## 摘要",
          article.summary || "",
          "## 嘉宾介绍",
          `${article.guest_name || "核心嘉宾待确认"}：${article.guest_intro || ""}`,
          "## 重要观点",
          buildInsightMarkdown(article.insights?.length ? article.insights : article.key_points),
          "## 编辑解读",
          article.editorial_analysis || "",
          "## 原始链接",
          article.play_url || article.episode_url || "",
        ].join("\n\n");
      }

      function normalizeInsight(point, index) {
        if (point && typeof point === "object") {
          return {
            title: point.title || `洞察 ${index + 1}`,
            claim: point.claim || point.core_claim || "",
            analysis: point.analysis || point.deep_analysis || "",
            value: point.value || point.strategic_value || "",
          };
        }
        return {
          title: String(point || `洞察 ${index + 1}`),
          claim: "",
          analysis: "",
          value: "",
        };
      }

      function buildInsightMarkdown(points) {
        return (points || [])
          .map((point, index) => {
            const insight = normalizeInsight(point, index);
            return [
              `### ${insight.title}`,
              "**核心论断：**",
              insight.claim ? `> ${insight.claim}` : "> 基于公开材料的核心判断，待人工核验。",
              "**深层分析：**",
              insight.analysis || "公开材料暂不足以展开更完整的分析。",
              "**战略价值：**",
              insight.value || "这条洞察需要结合原始访谈进一步判断。",
            ].join("\n\n");
          })
          .join("\n\n---\n\n");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      void requireAdmin();
    </script>
  </body>
</html>
